name: CI - Test, Build & Publish Image to GHCR & Docker Hub

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    name: API & forensics tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install serving dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Fetch exported model from the HF Hub
        run: python -c "from server.app import _ensure_model; _ensure_model()"
      - name: Run tests
        run: pytest -q tests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  build-and-push:
    name: Build and push Docker image to GHCR & Docker Hub
    needs: [test, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile
          tags: |
            ghcr.io/darainhyder/image-quality-assessment:latest
            ghcr.io/darainhyder/image-quality-assessment:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/image-quality-assessment:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/image-quality-assessment:${{ github.sha }}
